    <script>
      (function() {
        try {
          var saved = localStorage.getItem('cms_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-white dark:bg-[#101010] text-[#101010] dark:text-white antialiased selection:bg-[#E50914] selection:text-white transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
